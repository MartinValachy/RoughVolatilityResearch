[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roughnoisy"
version = "0.1.0"
description = "Independent roughness, observation error and volatility forecast research pilot"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "requests", "pypdf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
